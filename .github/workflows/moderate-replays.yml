name: Moderate replay votes

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"

permissions:
  contents: read

concurrency:
  group: replay-gallery-moderation
  cancel-in-progress: true

jobs:
  moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: moderation/requirements.txt

      - name: Install moderator dependencies
        run: python -m pip install --disable-pip-version-check -r moderation/requirements.txt

      - name: Test moderation logic
        working-directory: moderation
        run: python -m unittest -v test_moderate.py

      - name: Process community votes
        env:
          FIREBASE_DATABASE_URL: https://showcase-reborn-macros-default-rtdb.firebaseio.com
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: python moderation/moderate.py
